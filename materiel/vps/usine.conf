# /etc/mosquitto/conf.d/usine.conf — broker MQTT du projet Groupe 7
# Authentification obligatoire (ENF6) : un compte par ESP32 + un compte pour le serveur.
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl
persistence true

# Version chiffrée (recommandée sur Internet) : décommenter, puis UTILISER_TLS 1 dans les croquis.
